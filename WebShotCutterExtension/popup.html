<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Shot Cutter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <img src="icons/icon48.png" alt="" class="logo">
        <div>
          <h1>Web Shot Cutter</h1>
          <p id="status">캡처 방식을 선택하세요.</p>
        </div>
      </header>

      <section class="panel">
        <label for="format">다운로드 형식</label>
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="pdf">PDF</option>
        </select>
      </section>

      <section class="panel action-list">
        <button id="areaBtn" type="button">영역 선택</button>
        <button id="visibleBtn" type="button">전체 선택</button>
      </section>

      <section class="panel">
        <label for="cutCount">스크롤 컷 수</label>
        <div class="row">
          <input id="cutCount" type="number" min="1" max="30" value="3">
          <button id="scrollBtn" type="button">촬영</button>
        </div>
        <p class="note">스크롤 촬영은 컷을 세로로 이어붙여 PDF로 저장합니다.</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
